<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>タスク一覧</title>
</head>
<body>
    <h1>タスク一覧</h1>

    <div th:each="task : ${tasks}">
        <p th:text="${task.taskName}"></p>
    </div>
    <br>
    <a th:href="@{/task}">
         <button type="button">登録画面</button>
    </a>
</body>
</html>
