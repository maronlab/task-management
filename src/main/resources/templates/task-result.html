<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>タスク表示</title>
</head>

<body>
    <h1>タスク登録結果</h1>

    <p>タスク名：<span th:text="${task.taskName}"></span></p>
    <p>期限：<span th:text="${task.period}"></span></p>
    <p>優先度：<span th:text="${task.priority}"></span></p>
    <p>ステータス：<span th:text="${task.status}"></span></p>

    <a th:href="@{/task}">
        <button type="button">登録画面</button>
    </a>
    <a th:href="@{/tasks}">
        <button type="button">一覧</button>
    </a>
</body>

</html>
